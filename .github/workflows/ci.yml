name: CI

# Test all three SDKs on every push and PR. Each job also runs the shared
# cross-SDK test vectors in //test-vectors, so a parity regression in any one
# language fails CI.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  stable-release-gate:
    name: Stable release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release readiness
        run: python3 scripts/stable_release_gate.py

  # F-DOC-10: a doc that states a fact the repository can compute (the version in
  # an install snippet, the schema list, a benchmark number) must agree with it.
  docs-truth:
    name: Docs truth (versions, schemas, benchmark numbers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests for the checks
        run: node --test scripts/check-docs-truth.test.mjs scripts/gen-benchmark-results.test.mjs
      - name: Docs agree with the package version and spec/
        run: node scripts/check-docs-truth.mjs
      - name: benchmarks/RESULTS.md matches benchmarks/latest.json
        run: node scripts/gen-benchmark-results.mjs --check

  python:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/gavio-py
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,redis]"
      - name: Lint (ruff)
        run: ruff check gavio tests
      - name: Test (pytest, incl. shared vectors + Redis backend, F-CACHE-04)
        run: pytest tests/unit -q

  javascript:
    name: JavaScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/gavio-js
    strategy:
      matrix:
        node-version: ["18", "20", "22"]
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test (vitest, incl. shared vectors + Redis backend, F-CACHE-04)
        run: npm test

  control-plane:
    name: Control Plane app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test (file + SQLite persistence)
        run: npm test

  java:
    name: Java SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/gavio-java
    strategy:
      matrix:
        java-version: ["17", "21"]
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
      - name: Test (maven, incl. shared vectors + Redis backend, F-CACHE-04)
        run: mvn -B test

  # F-DX-13: examples must stay in parity across SDKs and must run against the
  # code in THIS repository, not the last published packages, so a feature can
  # ship with its example before the release is cut.
  examples:
    name: Examples (parity + in-repo SDKs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/gavio-js/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Example matrix (paths, gaps, README tables)
        run: |
          node --test scripts/check-example-matrix.test.mjs
          node scripts/check-example-matrix.mjs --check
      - name: Run every example against the in-repo SDKs
        # pip install -e packages/gavio-py, npm pack of packages/gavio-js, and a
        # reactor `mvn install` into an isolated local repository; see
        # examples/README.md "Run against the in-repo SDKs".
        run: node scripts/run-examples.mjs

  benchmarks:
    name: Inspector overhead benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Python harness (thresholds enforced, INSPECTOR_PLAN §13)
        run: python3 benchmarks/inspector/bench.py
      - name: Build JS SDK
        working-directory: packages/gavio-js
        run: npm ci && npm run build
      - name: JavaScript harness
        run: node benchmarks/inspector/bench.mjs
      - name: Java harness
        working-directory: packages/gavio-java
        run: mvn -B -q -pl gavio-core test -Dtest=InspectorOverheadBench
